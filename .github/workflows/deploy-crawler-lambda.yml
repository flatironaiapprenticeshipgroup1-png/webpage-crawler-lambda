name: Deploy Crawler Lambda

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        run: |
          docker build --platform linux/amd64 -t webpage-crawler-lambda .
          docker tag webpage-crawler-lambda:latest 950119649814.dkr.ecr.us-east-1.amazonaws.com/webpage-crawler-lambda:latest
          docker push 950119649814.dkr.ecr.us-east-1.amazonaws.com/webpage-crawler-lambda:latest

      - name: Deploy new image to Lambda
        run: |
          aws lambda update-function-code \
            --function-name webpage-crawler \
            --image-uri 950119649814.dkr.ecr.us-east-1.amazonaws.com/webpage-crawler-lambda:latest
